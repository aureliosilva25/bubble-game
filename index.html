<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07111f"><title>Bubble Color</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css?v=21"></head><body><div id="app"><header><div><h1>BUBBLE COLOR</h1><p>Combine, estoure e avance!</p></div><div class="wallet">⭐ <b id="starsTotal">0</b>　🪙 <b id="coins">0</b></div></header><main><section id="home" class="screen active"><div class="hero"><div class="logo">●</div><h2>Pronto para jogar?</h2><p>Junte 3 ou mais bolhas da mesma cor.</p><button id="continueBtn" class="primary">▶ CONTINUAR</button><button id="chooseBtn">🗺️ ESCOLHER FASE</button><button id="installBtn">📲 INSTALAR APLICATIVO</button><div id="installHint" class="installHint"></div></div></section><section id="levels" class="screen"><div class="bar"><button class="back">←</button><h2>FASES</h2><span id="progressTxt"></span></div><div id="levelGrid"></div></section><section id="game" class="screen"><div class="bar"><button id="gameBack">←</button><span>FASE <b id="levelNo">1</b></span><span>PONTOS <b id="score">0</b></span><span>JOGADAS <b id="moves">0</b></span></div><div class="objective">💥 Elimine todas as bolinhas · Restantes: <b id="remaining">0</b></div><canvas id="canvas"></canvas><div class="footer"><div>PRÓXIMA<div id="nextBall"></div></div><button id="swapBtn">⇄ TROCAR</button><div>COMBO<br><b id="combo">x1</b></div></div></section></main><div id="modal"><div class="card"><div id="modalIcon">🏆</div><h2 id="modalTitle"></h2><div id="modalStars"></div><p id="modalText"></p><button id="nextBtn" class="primary">PRÓXIMA FASE</button><button id="levelsBtn">VER FASES</button></div></div></div><script src="./levels.js?v=21"></script><script src="./game.js?v=21"></script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));</script><script>
let deferredInstallPrompt=null;
const installBtn=document.getElementById("installBtn"),installHint=document.getElementById("installHint");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e});
installBtn.addEventListener("click",async()=>{
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 const installed=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
 if(installed){installHint.innerHTML="✅ O Bubble Color já está instalado.";installHint.style.display="block";return}
 if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}
 installHint.innerHTML=ios?"No iPhone/iPad: abra no <b>Safari</b>, toque em <b>Compartilhar</b> e depois <b>Adicionar à Tela de Início</b>.":"Abra o endereço publicado no <b>GitHub Pages</b> pelo Chrome/Edge. Depois toque novamente em <b>Instalar aplicativo</b> ou use o menu do navegador → <b>Instalar app</b>.";
 installHint.style.display="block";
});
window.addEventListener("appinstalled",()=>{installHint.innerHTML="✅ Bubble Color instalado com sucesso!";installHint.style.display="block";installBtn.style.display="none"});
</script></body></html>
