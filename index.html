<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble Color</title><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="stylesheet" href="css/style.css?v=13"></head><body><div id="app">
<section id="homeScreen" class="screen active"><div class="home-content"><div class="logo-area"><div class="logo-bubbles"><span class="logo-ball red"></span><span class="logo-ball blue"></span><span class="logo-ball green"></span><span class="logo-ball yellow"></span></div><h1>BUBBLE <span>COLOR</span></h1><p>Combine, estoure e avance!</p></div><div class="home-stats"><div class="stat-card">⭐ <strong id="homeStars">0</strong></div><div class="stat-card">🪙 <strong id="homeCoins">0</strong></div></div><button id="btnContinue" class="main-button primary-button">▶ CONTINUAR</button><button id="btnPlay" class="main-button secondary-button">🗺️ ESCOLHER FASE</button></div></section>
<section id="levelsScreen" class="screen"><header class="top-bar"><button id="btnLevelsBack" class="icon-button">←</button><div class="top-title"><strong>FASES</strong><small id="progressText">1 / 100</small></div><div class="coins-display">🪙 <span id="levelCoins">0</span></div></header><div class="progress-container"><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div></div><main class="levels-content"><div id="levelsGrid" class="levels-grid"></div></main></section>
<section id="gameScreen" class="screen"><header class="game-header"><button id="btnGameBack" class="icon-button">←</button><div class="level-display"><small>FASE</small><strong id="currentLevel">1</strong></div><div class="score-display"><small>PONTOS</small><strong id="score">0</strong></div></header><div class="objective-bar"><div class="objective-description"><span id="objectiveIcon">💥</span><div><small>OBJETIVO</small><strong id="objectiveText">Elimine todas as bolinhas</strong></div></div><div class="target-display"><small>RESTANTES</small><strong id="targetScore">0</strong></div></div><div class="game-board-wrapper"><canvas id="gameCanvas"></canvas><div id="comboMessage" class="combo-message">COMBO!</div></div><div class="game-bottom"><div class="moves-card"><small>JOGADAS</small><strong id="movesLeft">0</strong></div><div class="shooter-preview"><div><small>PRÓXIMA</small><div id="nextBall" class="preview-ball next-ball"></div></div><div><small>ATUAL</small><div id="currentBall" class="preview-ball current-ball"></div></div></div><button id="btnSwap" class="swap-button">⇄<small>TROCAR</small></button></div></section>
<div id="winModal" class="modal"><div class="modal-card"><div class="modal-icon">🏆</div><h2>FASE CONCLUÍDA!</h2><div id="winStars" class="win-stars">⭐⭐⭐</div><div class="result-row"><span>Pontuação</span><strong id="finalScore">0</strong></div><div class="result-row"><span>Recompensa</span><strong>🪙 <span id="coinReward">0</span></strong></div><button id="btnNextLevel" class="main-button primary-button">PRÓXIMA FASE ▶</button><button id="btnWinLevels" class="modal-secondary-button">MAPA DE FASES</button></div></div>
<div id="loseModal" class="modal"><div class="modal-card"><div class="modal-icon">😵</div><h2>TENTE NOVAMENTE</h2><p>Você ainda consegue!</p><button id="btnRetry" class="main-button primary-button">🔄 TENTAR NOVAMENTE</button><button id="btnLoseLevels" class="modal-secondary-button">MAPA DE FASES</button></div></div>
<div id="pauseModal" class="modal"><div class="modal-card"><div class="modal-icon">⏸️</div><h2>JOGO PAUSADO</h2><button id="btnResume" class="main-button primary-button">▶ CONTINUAR</button><button id="btnExitLevel" class="modal-secondary-button">SAIR DA FASE</button></div></div></div>
<script src="js/levels.js?v=13"></script><script src="js/game.js?v=13"></script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));</script></body></html>
